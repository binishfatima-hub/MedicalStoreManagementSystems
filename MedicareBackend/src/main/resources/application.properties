spring.application.name=MediCareBackend

# ============================================================
#  MySQL DATABASE
#  Change the username / password below to match your MySQL.
#  Run database/schema.sql once before starting the app.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/medical_store?useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=fatima

# ============================================================
#  JPA / HIBERNATE
#  ddl-auto=none  ->  Hibernate never changes the tables.
#  The tables are created only by database/schema.sql, so the
#  database stays exactly the way we designed it.
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
#  SERVER
#  The website talks to http://localhost:8080
# ============================================================
server.port=8080

# ============================================================
#  SERVE THE WEBSITE TOO
#
#  Spring Boot also hands out the HTML/CSS/JS files from the
#  MediCareWebsite folder, so ONE server runs everything and
#  http://localhost:8080 opens the site directly.
#
#  Two paths are listed because the app may be started from
#  the project root or from inside MedicareBackend - whichever
#  folder exists is used.
# ============================================================
spring.web.resources.static-locations=file:../MediCareWebsite/,file:./MediCareWebsite/,classpath:/static/
