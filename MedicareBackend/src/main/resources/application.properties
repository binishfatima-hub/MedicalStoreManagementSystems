spring.application.name=MediCareBackend

# ============================================================
#  MySQL DATABASE
#
#  Written as  ${NAME:default}  which means:
#     "use the environment variable NAME if it is set,
#      otherwise use the default written after the colon"
#
#  So on YOUR computer nothing changes - it keeps using the
#  local MySQL below. On the cloud (Render) we set these three
#  environment variables to point at the online database, and
#  the real cloud password never has to be written in this file.
#
#  Run database/schema.sql once before starting the app.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medical_store?useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fatima}

# ============================================================
#  JPA / HIBERNATE
#  ddl-auto=none  ->  Hibernate never changes the tables.
#  The tables are created only by database/schema.sql, so the
#  database stays exactly the way we designed it.
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
#  CONNECTION POOL
#  A free online database allows only a few connections, and
#  it may be idle for a long time, so keep the pool small and
#  drop connections that have gone stale.
# ============================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

# ============================================================
#  SERVER
#  Locally this is 8080. Render decides its own port and passes
#  it in the PORT environment variable, so we read that first.
# ============================================================
server.port=${PORT:8080}

# ============================================================
#  SERVE THE WEBSITE TOO
#
#  Spring Boot also hands out the HTML/CSS/JS files, so ONE
#  server runs everything and opening the address shows the
#  site directly.
#
#  The list is tried in order:
#    file:../MediCareWebsite/  - running from MedicareBackend
#    file:./MediCareWebsite/   - running from the project root
#    classpath:/static/        - running from the built jar
#
#  On your computer the file: paths win, so editing an HTML
#  file and refreshing the browser shows the change at once.
#  On the cloud those folders do not exist, so it falls back
#  to the copy packed inside the jar.
# ============================================================
spring.web.resources.static-locations=file:../MediCareWebsite/,file:./MediCareWebsite/,classpath:/static/
